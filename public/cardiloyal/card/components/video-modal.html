<!-- ========================================================
     VIDEO MODAL POPUP: INTERAKTIF 3 VIDEO TUTORIAL & CARA KERJA
     ======================================================== -->
<div id="videoModal"
    class="fixed inset-0 z-[9999] flex items-center justify-center p-3 sm:p-5 opacity-0 pointer-events-none transition-all duration-300 ease-out"
    role="dialog" aria-modal="true" aria-labelledby="videoModalTitle">

    <!-- Backdrop / Overlay: Gelap transparan dengan blur (backdrop-blur-sm bg-black/80) -->
    <div id="videoModalBackdrop"
        class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity duration-300"></div>

    <!-- Card Modal: Max-width ~800px, rounded-2xl, background dark elegan (#0f172a), border halus & shadow mewah -->
    <div id="videoModalCard"
        class="relative w-full max-w-[800px] bg-[#0f172a] text-white rounded-2xl border border-slate-700/80 shadow-2xl overflow-hidden z-10 transform scale-95 transition-all duration-300 flex flex-col max-h-[92vh]">

        <!-- Modal Header -->
        <div class="flex items-center justify-between px-4 sm:px-6 py-3.5 sm:py-4 border-b border-slate-800 bg-[#0f172a]/95 shrink-0">
            <div class="flex items-center gap-2.5 sm:gap-3">
                <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-brand-500 to-amber-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 shrink-0">
                    <svg class="w-4 h-4 sm:w-4.5 sm:h-4.5 fill-current ml-0.5" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div>
                    <h3 id="videoModalTitle" class="text-sm sm:text-base font-extrabold text-white tracking-tight flex items-center gap-2">
                        <span>Video Panduan &amp; Demo</span>
                        <span class="text-[9.5px] sm:text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400 border border-brand-500/30">Cardi Loyal</span>
                    </h3>
                    <p id="videoActiveSubtitle" class="text-[11px] sm:text-xs text-slate-400 font-medium line-clamp-1">
                        1. Tutorial &amp; Cara Kerja
                    </p>
                </div>
            </div>

            <!-- Tombol Tutup: Icon silang (✕) di pojok kanan atas -->
            <button id="btnCloseVideoModal" type="button"
                class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-800/90 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700/80 transition-all flex items-center justify-center cursor-pointer select-none focus:outline-none focus:ring-2 focus:ring-brand-500/50"
                aria-label="Tutup video popup">
                <svg class="w-4 h-4 sm:w-4.5 sm:h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Modal Body (Responsif & rapi) -->
        <div class="p-3.5 sm:p-5 overflow-y-auto modal-scroll space-y-3.5 sm:space-y-4">
            <!-- Container Responsif 16:9 (Aspect-Video) -->
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800/90">
                <iframe id="videoModalIframe"
                    class="absolute inset-0 w-full h-full border-0"
                    src=""
                    title="Video Player Cardi Loyal"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Tab / Tombol Navigasi 3 Video -->
            <div>
                <div class="text-[11px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider mb-2.5 px-0.5 flex items-center justify-between">
                    <span class="flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-brand-400" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z" />
                        </svg>
                        <span>Pilih Video Demonstrasi:</span>
                    </span>
                    <span class="text-[10px] text-slate-400 font-normal">3 Video Siap Diputar</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-2.5" role="tablist">
                    <!-- Tab 1 (Default) -->
                    <button type="button"
                        class="video-tab-btn group p-2.5 sm:p-3 rounded-xl border text-left transition-all duration-200 cursor-pointer flex items-center sm:flex-col sm:items-start gap-2.5 sm:gap-1.5 focus:outline-none"
                        data-video-id="APnB4E1-AkI"
                        data-video-title="1. Tutorial &amp; Cara Kerja"
                        role="tab"
                        aria-selected="true">
                        <div class="w-7 h-7 sm:w-6 sm:h-6 rounded-lg flex items-center justify-center shrink-0 tab-icon-box">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-xs sm:text-[13px] font-bold tab-title truncate">1. Tutorial &amp; Cara Kerja</div>
                            <div class="text-[10px] sm:text-[11px] tab-desc line-clamp-1 opacity-80">Panduan Praktis Tap NFC</div>
                        </div>
                    </button>

                    <!-- Tab 2 -->
                    <button type="button"
                        class="video-tab-btn group p-2.5 sm:p-3 rounded-xl border text-left transition-all duration-200 cursor-pointer flex items-center sm:flex-col sm:items-start gap-2.5 sm:gap-1.5 focus:outline-none"
                        data-video-id="BZIvQ2YKWSY"
                        data-video-title="2. Demo Langsung di Kasir"
                        role="tab"
                        aria-selected="false">
                        <div class="w-7 h-7 sm:w-6 sm:h-6 rounded-lg flex items-center justify-center shrink-0 tab-icon-box">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-xs sm:text-[13px] font-bold tab-title truncate">2. Demo Langsung di Kasir</div>
                            <div class="text-[10px] sm:text-[11px] tab-desc line-clamp-1 opacity-80">Simulasi Meja Kasir</div>
                        </div>
                    </button>

                    <!-- Tab 3 -->
                    <button type="button"
                        class="video-tab-btn group p-2.5 sm:p-3 rounded-xl border text-left transition-all duration-200 cursor-pointer flex items-center sm:flex-col sm:items-start gap-2.5 sm:gap-1.5 focus:outline-none"
                        data-video-id="d2qj65I6J-o"
                        data-video-title="3. Cerita &amp; Visi Produk"
                        role="tab"
                        aria-selected="false">
                        <div class="w-7 h-7 sm:w-6 sm:h-6 rounded-lg flex items-center justify-center shrink-0 tab-icon-box">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-xs sm:text-[13px] font-bold tab-title truncate">3. Cerita &amp; Visi Produk</div>
                            <div class="text-[10px] sm:text-[11px] tab-desc line-clamp-1 opacity-80">Visi &amp; Manfaat Bisnis</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="px-4 sm:px-6 py-2.5 bg-slate-950/80 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400 shrink-0">
            <span class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-slate-300">Autoplay aktif saat tab diklik</span>
            </span>
            <span class="text-slate-500 text-[10px]">Klik luar / Tekan <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 font-mono text-[9px]">ESC</kbd> untuk tutup</span>
        </div>
    </div>
</div>
